name: PXView Cross-Repo Build

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch/tag/SHA to build (e.g. view_and_data, main, abc123)'
        required: true
        default: 'view_and_data'
      targets:
        description: 'Which platforms to build (linux / mac / both)'
        required: true
        default: 'both'
        type: choice
        options: [linux, mac, both]
  repository_dispatch:
    types: [build]

jobs:
  linux:
    name: Linux AppImage (x86_64)
    if: ${{ github.event.inputs.targets == 'linux' || github.event.inputs.targets == 'both' || github.event.action == 'build' }}
    runs-on: ubuntu-22.04
    env:
      QT_PREFIX: ${{ github.workspace }}/Qt
      QT_VERSION: "6.11.0"
      LINUXDEPLOY_VERSION: "continuous"

    steps:
      - name: Resolve ref
        id: ref
        run: |
          if [ -n "${{ github.event.inputs.ref }}" ]; then
            echo "value=${{ github.event.inputs.ref }}" >> $GITHUB_OUTPUT
          else
            echo "value=${{ github.event.client_payload.ref }}" >> $GITHUB_OUTPUT
          fi

      - name: Checkout private PXView repo
        uses: actions/checkout@v4
        with:
          repository: haikumuse/PXView
          ref: ${{ steps.ref.outputs.value }}
          token: ${{ secrets.PXVIEW_PAT }}
          submodules: recursive
          persist-credentials: false

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git gcc g++ make cmake ninja-build pkg-config \
            libglib2.0-dev zlib1g-dev libusb-1.0-0-dev libudev-dev \
            libboost-dev libfftw3-dev libssl-dev \
            python3-dev python3-pip \
            libgl1-mesa-dev libxkbcommon-dev libxkbcommon-x11-0 libvulkan-dev \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-render0 libxcb-render-util0 libxcb-randr0 libxcb-shape0 \
            libxcb-shm0 libxcb-sync1 libxcb-xfixes0 libxcb-xinerama0 \
            libxcb-xinput0 libxcb-xkb1 libxcb-util1 \
            libwayland-dev libwayland-egl1 libwayland-client0 libwayland-cursor0 \
            libzip-dev nettle-dev libftdi1-dev \
            sdcc wget

      - name: Setup Node.js (for Web UI)
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install Qt via aqtinstall
        run: |
          pip3 install aqtinstall
          aqt install-qt linux desktop ${{ env.QT_VERSION }} linux_gcc_64 \
            -m qtwebsockets --outputdir ${{ env.QT_PREFIX }}
          echo "=== Platform plugins before qtwayland build ==="
          ls -la ${{ env.QT_PREFIX }}/${{ env.QT_VERSION }}/gcc_64/plugins/platforms/ || true

      - name: Build qtwayland platform plugin
        run: |
          # aqtinstall does not provide the qtwayland client platform plugin.
          # Build it from source against the aqtinstalled Qt so the AppImage
          # bundles both xcb and wayland platform plugins.
          # Only build the client side — the compositor (server) needs libdrm
          # and we don't need it (PXView is a client app, not a compositor).
          sudo apt-get install -y wayland-protocols libwayland-dev
          git clone --branch v${{ env.QT_VERSION }} --depth 1 https://github.com/qt/qtwayland.git
          cd qtwayland
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="${{ env.QT_PREFIX }}/${{ env.QT_VERSION }}/gcc_64" \
            -DCMAKE_INSTALL_PREFIX="${{ env.QT_PREFIX }}/${{ env.QT_VERSION }}/gcc_64" \
            -DQT_FEATURE_wayland_server=OFF \
            -DQT_FEATURE_wayland_client=ON
          cmake --build build --parallel $(nproc)
          cmake --install build
          echo "=== Platform plugins after qtwayland build ==="
          ls -la ${{ env.QT_PREFIX }}/${{ env.QT_VERSION }}/gcc_64/plugins/platforms/

      - name: Build fx2lafw firmware
        run: |
          bash build_fx2lafw.sh || echo "WARNING: fx2lafw firmware build failed"

      - name: Configure CMake
        run: |
          rm -rf build && mkdir -p build && cd build
          # linuxdeploy expects AppDir to contain usr/{bin,share,lib}.
          # Install to install.dir/usr so paths align with linuxdeploy's --appdir.
          cmake .. -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=../install.dir/usr \
            -DCMAKE_PREFIX_PATH="${{ env.QT_PREFIX }}/${{ env.QT_VERSION }}/gcc_64"

      - name: Build and Install Web UI (optional)
        run: |
          cd build && ninja install-webui || echo "WARNING: Web UI skipped"

      - name: Build PXView
        run: cd build && ninja -j $(nproc)

      - name: Install
        run: cd build && ninja install

      - name: Bundle Python standard library into AppDir
        run: |
          # libsigrokdecode 内嵌 Python 解释器,需要 Python 标准库(encodings 等模块)
          # 否则用户系统若 Python 版本不匹配(如构建用 3.10, 用户是 3.12)
          # 会出现 "ModuleNotFoundError: No module named 'encodings'" 启动失败
          PY_VERSION=$(python3 -c 'import sys; print(f"{sys.version_info.major}.{sys.version_info.minor}")')
          echo "Bundling Python $PY_VERSION standard library"
          # 复制标准库 .py 文件
          mkdir -p install.dir/usr/lib/python$PY_VERSION
          cp -a /usr/lib/python$PY_VERSION/* install.dir/usr/lib/python$PY_VERSION/ 2>/dev/null || true
          # 复制 lib-dynload(encodings 等内置模块的 .so 文件)
          mkdir -p install.dir/usr/lib/python$PY_VERSION/lib-dynload
          cp -a /usr/lib/python$PY_VERSION/lib-dynload/* install.dir/usr/lib/python$PY_VERSION/lib-dynload/ 2>/dev/null || true
          # 删除不必要的测试和 __pycache__ 以减小体积
          rm -rf install.dir/usr/lib/python$PY_VERSION/test
          rm -rf install.dir/usr/lib/python$PY_VERSION/__pycache__
          find install.dir/usr/lib/python$PY_VERSION -name '__pycache__' -type d -exec rm -rf {} + 2>/dev/null || true
          # 同时打包 python3 目录(部分发行版 stdlib 在这里)
          if [ -d /usr/lib/python$PY_VERSION/encodings ]; then
            echo "OK: encodings module found at /usr/lib/python$PY_VERSION/encodings"
          else
            echo "WARN: encodings not found in /usr/lib/python$PY_VERSION, AppImage Python may fail"
          fi
          echo "Bundled Python stdlib size:"
          du -sh install.dir/usr/lib/python$PY_VERSION

      - name: Create AppImage using linuxdeploy
        run: |
          wget -c "https://github.com/linuxdeploy/linuxdeploy/releases/download/${{ env.LINUXDEPLOY_VERSION }}/linuxdeploy-x86_64.AppImage"
          wget -c "https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/${{ env.LINUXDEPLOY_VERSION }}/linuxdeploy-plugin-qt-x86_64.AppImage"
          chmod +x linuxdeploy*.AppImage
          export QMAKE="${{ env.QT_PREFIX }}/${{ env.QT_VERSION }}/gcc_64/bin/qmake"
          export LD_LIBRARY_PATH="${{ env.QT_PREFIX }}/${{ env.QT_VERSION }}/gcc_64/lib:$LD_LIBRARY_PATH"
          export OUTPUT="PXView-x86_64.AppImage"
          ./linuxdeploy-x86_64.AppImage \
            --appdir install.dir \
            -e install.dir/usr/bin/PXView \
            -d install.dir/usr/share/applications/pxview.desktop \
            --plugin qt \
            --output appimage

      - name: Verify AppImage
        run: |
          ls -la PXView-x86_64.AppImage
          chmod +x PXView-x86_64.AppImage

      - name: Package udev rules (separate artifact)
        run: |
          # udev rules must be installed to system path, not inside AppImage.
          # Package them separately with an install script.
          # Includes:
          #   - 60-px.rules: PXView-specific rules (PXLogic/Qinheng/Van Ooijen VID)
          #   - 60-libsigrok.rules: marks all libsigrok-supported USB devices with ID_SIGROK=1
          #   - 61-libsigrok-plugdev.rules: grants plugdev group access (Debian-based)
          #   - 61-libsigrok-uaccess.rules: grants local logged-in user access (systemd-logind)
          mkdir -p udev-rules
          cp install.dir/usr/lib/udev/rules.d/60-px.rules udev-rules/
          cp libsigrok/contrib/60-libsigrok.rules udev-rules/
          cp libsigrok/contrib/61-libsigrok-plugdev.rules udev-rules/
          cp libsigrok/contrib/61-libsigrok-uaccess.rules udev-rules/
          cat > udev-rules/install-udev-rules.sh << 'EOF'
          #!/bin/bash
          # Install udev rules for PXView hardware access (non-root USB permission)
          # Covers PXView devices (PXLogic, Qinheng, etc.) and all libsigrok-supported devices.
          # Usage: sudo ./install-udev-rules.sh
          set -e
          RULES_FILES="60-px.rules 60-libsigrok.rules 61-libsigrok-plugdev.rules 61-libsigrok-uaccess.rules"
          if [ "$(id -u)" -ne 0 ]; then
            echo "Please run with sudo: sudo $0"
            exit 1
          fi
          # Find system udev rules directory
          if [ -d /usr/lib/udev/rules.d ]; then
            DEST=/usr/lib/udev/rules.d
          elif [ -d /lib/udev/rules.d ]; then
            DEST=/lib/udev/rules.d
          elif [ -d /etc/udev/rules.d ]; then
            DEST=/etc/udev/rules.d
          else
            echo "Error: No udev rules directory found"
            exit 1
          fi
          echo "Installing udev rules to $DEST/"
          for f in $RULES_FILES; do
            if [ ! -f "$f" ]; then
              echo "Warning: $f not found, skipping"
              continue
            fi
            cp "$f" "$DEST/$f"
            echo "  -> installed $f"
          done
          udevadm control --reload-rules
          udevadm trigger
          echo ""
          echo "Done. PXView hardware devices should now be accessible without sudo."
          echo "Note: For the 'plugdev' group rule to take effect, add yourself to the group:"
          echo "  sudo usermod -aG plugdev \$USER"
          echo "Then log out and back in (or run 'newgrp plugdev')."
          EOF
          chmod +x udev-rules/install-udev-rules.sh
          # Create tarball
          tar -czf PXView-udev-rules.tar.gz -C udev-rules .
          ls -la PXView-udev-rules.tar.gz
          echo "=== udev rules contents ==="
          tar -tzf PXView-udev-rules.tar.gz

      - name: Upload AppImage Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PXView-Linux-x86_64-AppImage-${{ steps.ref.outputs.value }}
          path: PXView-x86_64.AppImage
          if-no-files-found: error

      - name: Upload udev rules Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PXView-Linux-udev-rules-${{ steps.ref.outputs.value }}
          path: PXView-udev-rules.tar.gz
          if-no-files-found: error

  mac:
    name: macOS (${{ matrix.arch }})
    if: ${{ github.event.inputs.targets == 'mac' || github.event.inputs.targets == 'both' || github.event.action == 'build' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # ARM64: 原生编译，直接在 Apple Silicon (M1) runner 上构建
          - arch: ARM64
            cross_compile: false
          # x86_64: 在 ARM64 runner 上通过 Rosetta 2 交叉编译
          # GitHub 已下线 macos-13 (Intel) runner，macos-14/15 全部是 ARM64。
          # 方案：安装 x86_64 Homebrew (/usr/local) + Rosetta 2，
          #       整个工具链 (cmake/ninja/clang/Qt) 以 x86_64 模式运行，
          #       效果等同于在 Intel Mac 上原生编译。
          - arch: x86_64
            cross_compile: true
    runs-on: macos-14
    steps:
      - name: Resolve ref
        id: ref
        run: |
          if [ -n "${{ github.event.inputs.ref }}" ]; then
            echo "value=${{ github.event.inputs.ref }}" >> $GITHUB_OUTPUT
          else
            echo "value=${{ github.event.client_payload.ref }}" >> $GITHUB_OUTPUT
          fi

      - name: Checkout private PXView repo
        uses: actions/checkout@v4
        with:
          repository: haikumuse/PXView
          ref: ${{ steps.ref.outputs.value }}
          token: ${{ secrets.PXVIEW_PAT }}
          submodules: recursive
          persist-credentials: false

      - name: Setup x86_64 cross-compilation (Rosetta 2)
        if: matrix.cross_compile
        run: |
          # 安装 Rosetta 2（macos-14 是 ARM64，需要 Rosetta 运行 x86_64 二进制）
          softwareupdate --install-rosetta --agree-to-license || true

          # 安装 x86_64 Homebrew 到 /usr/local
          # ARM64 Homebrew 在 /opt/homebrew，x86_64 Homebrew 在 /usr/local，互不冲突
          if [ ! -f /usr/local/bin/brew ]; then
            NONINTERACTIVE=1 arch -x86_64 /bin/bash -c \
              "$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)"
          fi

          # 将 x86_64 Homebrew 的 bin 目录添加到 PATH 最前面
          # 这样 brew/cmake/ninja/qt 等工具都会使用 x86_64 版本（通过 Rosetta 2 运行）
          echo "/usr/local/bin" >> $GITHUB_PATH

          echo "=== x86_64 Homebrew ==="
          /usr/local/bin/brew --version
          echo "BREW_PREFIX=$(/usr/local/bin/brew --prefix)"

      - name: Install dependencies via Homebrew
        run: |
          brew update
          # sdcc: 编译 fx2lafw 固件（Cypress FX2 USB 芯片，老款逻辑分析仪用）
          # x86_64 构建时，brew/cmake/ninja 等通过 PATH 自动解析到 /usr/local/bin 下的 x86_64 版本
          brew install cmake ninja gettext glib libusb zlib boost fftw python3 qt pkg-config libzip nettle libftdi sdcc

      - name: Setup Node.js (for Web UI)
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Build fx2lafw firmware
        run: |
          # 编译 15 个 fx2lafw-*.fw 固件文件（Cypress FX2 USB 芯片）
          # 不装 sdcc 的话 CMake 会在 install 阶段跳过这些固件，导致使用 FX2 芯片
          # 的老款逻辑分析仪（Saleae Logic、Bitbang Cyclone 等）无法识别
          bash build_fx2lafw.sh || echo "WARNING: fx2lafw firmware build failed"

      - name: Configure CMake
        run: |
          rm -rf build && mkdir -p build && cd build
          export LDFLAGS="-L$(brew --prefix gettext)/lib"
          export CPPFLAGS="-I$(brew --prefix gettext)/include"
          export PKG_CONFIG_PATH="$(brew --prefix gettext)/lib/pkgconfig:$PKG_CONFIG_PATH"
          cmake .. -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$(brew --prefix qt)" \
            -DCMAKE_INSTALL_PREFIX=../install.dir

      - name: Build and Package Web UI
        run: cd build && ninja && ninja install-webui

      - name: Install
        run: cd build && ninja install

      - name: Create DMG using macdeployqt
        run: |
          MACDEPLOYQT="$(brew --prefix qt)/bin/macdeployqt"

          # Python framework 路径修正：
          # Homebrew python@3.x 把 framework 放在 <prefix>/Frameworks/Python.framework，
          # 但 macdeployqt 期望在 <prefix>/lib/Python.framework。
          # ARM64 和 x86_64 Homebrew 的 Python 版本可能不同（各自独立安装），
          # 所以用 python3 别名（Homebrew 会自动解析到实际版本）。
          PY_PREFIX="$(brew --prefix python3 2>/dev/null \
                       || brew --prefix python@3.14 2>/dev/null \
                       || brew --prefix python@3.13 2>/dev/null \
                       || brew --prefix python@3.12 2>/dev/null)"
          if [ -n "$PY_PREFIX" ]; then
            mkdir -p "$PY_PREFIX/lib"
            if [ ! -e "$PY_PREFIX/lib/Python.framework" ] && [ -e "$PY_PREFIX/Frameworks/Python.framework" ]; then
              ln -s "$PY_PREFIX/Frameworks/Python.framework" "$PY_PREFIX/lib/Python.framework"
            fi
          fi

          # macdeployqt 只做依赖收集，不传 -codesign=-。
          # 旧版 -codesign=- 只签主二进制和 Qt 框架，但被复制进 Frameworks 的
          # 非 Qt 传递依赖（libbrotlicommon/libsharpyuv/libwebp）未签名
          # → codesign --verify 失败 → Gatekeeper 报"已损坏"。
          # 签名由后续步骤显式控制，dmg 由最后 hdiutil 生成（保证签后内容一致）。
          $MACDEPLOYQT install.dir/PXView.app \
            -always-overwrite -verbose=1 \
            || true   # macdeployqt 对找不到的 rpath 返回非零，但已复制大部分依赖

          # 预先从 Homebrew 复制 macdeployqt 报错说找不到的三个 dylib
          # （Qt WebEngine/Pdf 的传递依赖，PXView 没直接用，但 macdeployqt 会扫描到）
          # 问题：macdeployqt 复制版本化 dylib 时可能只复制符号链接，
          # 导致 install_name_tool 修改后签名失效。
          # 解决：从 Homebrew lib 直接复制实际文件 + 建立正确的符号链接。
          BREW_LIB="$(brew --prefix)/lib"
          mkdir -p install.dir/PXView.app/Contents/Frameworks
          for dep in libbrotlicommon.1.dylib libsharpyuv.0.dylib libwebp.7.dylib; do
            real_path="$(readlink -f "$BREW_LIB/$dep" 2>/dev/null || echo "$BREW_LIB/$dep")"
            if [ -f "$real_path" ]; then
              real_name="$(basename "$real_path")"
              cp -f "$real_path" install.dir/PXView.app/Contents/Frameworks/"$real_name"
              if [ "$real_name" != "$dep" ]; then
                rm -f install.dir/PXView.app/Contents/Frameworks/"$dep"
                ln -s "$real_name" install.dir/PXView.app/Contents/Frameworks/"$dep"
              fi
              install_name_tool -id "@rpath/$dep" install.dir/PXView.app/Contents/Frameworks/"$real_name"
            fi
          done

          # 清除 Homebrew/缓存下载的库可能带的隔离标记
          xattr -cr install.dir/PXView.app

          # 用 --deep 一次性递归签名整个 .app。
          # 必须用 --deep：framework（如 Python.framework）的资源封印
          # 必须由 framework 目录签名建立，单独签 framework 内二进制
          # 会破坏资源封印 → "a sealed resource is missing or invalid"。
          # --deep 虽被 Apple 标记 deprecated（对分发签名而言），
          # 但对 CI 的 ad-hoc 签名是正确工具：它按从内到外顺序递归签名。
          # --force 覆盖所有可能失效的旧签名。
          codesign --force --deep --sign - install.dir/PXView.app

          # 验证签名，失败则构建失败并打印诊断信息
          if ! codesign --verify --deep --strict install.dir/PXView.app 2>&1; then
            echo "ERROR: codesign verification failed"
            echo "=== Diagnostic: libbrotlicommon.1.dylib ==="
            ls -la install.dir/PXView.app/Contents/Frameworks/libbrotlicommon* 2>/dev/null || true
            codesign -dvvv install.dir/PXView.app/Contents/Frameworks/libbrotlicommon.1.dylib 2>&1 || true
            echo "=== All Frameworks ==="
            ls -la install.dir/PXView.app/Contents/Frameworks/
            exit 1
          fi

          # 签名完成后生成 dmg
          hdiutil create -volname PXView -srcfolder install.dir/PXView.app \
            -ov -format UDZO install.dir/PXView.dmg
          ls -la install.dir/*.dmg

      - name: Verify DMG (headless launch test)
        run: |
          set -e

          # ── 挂载 DMG 并提取 .app 到可写临时目录 ──
          # 直接从 DMG 运行是只读的,可能导致 codesign/rpath 验证异常,先提取出来。
          hdiutil attach install.dir/PXView.dmg -nobrowse -mountpoint /tmp/vrf-mount
          rm -rf /tmp/PXView-vrf.app
          cp -R /tmp/vrf-mount/PXView.app /tmp/PXView-vrf.app
          hdiutil detach /tmp/vrf-mount
          xattr -cr /tmp/PXView-vrf.app

          APP_BIN="/tmp/PXView-vrf.app/Contents/MacOS/PXView"
          FW="/tmp/PXView-vrf.app/Contents/Frameworks"

          echo "=== 1. 二进制架构 ==="
          file "$APP_BIN"
          lipo -info "$APP_BIN" 2>/dev/null || true

          echo ""
          echo "=== 2. @rpath 依赖检查(主二进制) ==="
          MISS=0
          while IFS= read -r ln; do
            lib=$(echo "$ln" | sed 's/^[[:space:]]*//' | awk '{print $1}')
            nm="${lib#@rpath/}"
            if [ ! -f "$FW/$nm" ]; then
              echo "  缺失: $lib"
              MISS=$((MISS+1))
            fi
          done < <(otool -L "$APP_BIN" | grep '@rpath/')
          if [ "$MISS" -gt 0 ]; then
            echo "错误: $MISS 个 @rpath 依赖未在 Frameworks 中找到"
            exit 1
          fi
          echo "  主二进制所有 @rpath 依赖已解析"

          echo ""
          echo "=== 3. headless 启动测试 ==="
          echo "PXView --headless 模式使用 QCoreApplication(无需 GUI),"
          echo "但仍会加载 libsigrok、libsigrokdecode、Python framework、"
          echo "所有协议解码器,并启动 MCP(10110)/WS(10430) API 服务。"
          echo "如果任何 dylib 缺失或损坏,进程会立即崩溃。"
          echo ""
          echo "启动 PXView --headless,等待 15 秒..."

          if [ "${{ matrix.cross_compile }}" = "true" ]; then
            echo "运行模式: x86_64 (via Rosetta 2 on ARM64 runner)"
            arch -x86_64 "$APP_BIN" --headless -l 4 > /tmp/pxv-headless.log 2>&1 &
          else
            echo "运行模式: ARM64 (native)"
            "$APP_BIN" --headless -l 4 > /tmp/pxv-headless.log 2>&1 &
          fi
          PID=$!
          sleep 15

          if kill -0 "$PID" 2>/dev/null; then
            echo "通过: 进程存活 15 秒 — 所有库加载成功"
            # 检查 API 端口是否在监听
            if lsof -iTCP:10110 -sTCP:LISTEN -P 2>/dev/null | grep -q LISTEN; then
              echo "通过: MCP 端口 10110 正在监听"
            else
              echo "警告: MCP 端口 10110 未监听(可能仍在初始化)"
            fi
            if lsof -iTCP:10430 -sTCP:LISTEN -P 2>/dev/null | grep -q LISTEN; then
              echo "通过: WebSocket 端口 10430 正在监听"
            else
              echo "警告: WS 端口 10430 未监听(可能仍在初始化)"
            fi
            # 打印前 20 行输出用于诊断
            echo ""
            echo "=== 应用输出(前 20 行) ==="
            head -20 /tmp/pxv-headless.log 2>/dev/null || true
            kill "$PID" 2>/dev/null || true
            wait "$PID" 2>/dev/null || true
          else
            echo "失败: 进程在 15 秒内退出"
            EXIT_CODE=0
            wait "$PID" 2>/dev/null || EXIT_CODE=$?
            echo "退出码: $EXIT_CODE"
            echo ""
            echo "=== 应用输出日志 ==="
            cat /tmp/pxv-headless.log 2>/dev/null || true
            echo ""
            echo "=== 崩溃报告 ==="
            ls -lt ~/Library/Logs/DiagnosticReports/PXView* 2>/dev/null | head -5 || echo "未找到崩溃日志"
            cat ~/Library/Logs/DiagnosticReports/PXView*.crash 2>/dev/null | head -80 || true
            exit 1
          fi

          echo ""
          echo "=== ✅ DMG 验证通过 (${{ matrix.arch }}) ==="

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PXView-macOS-${{ matrix.arch }}-${{ steps.ref.outputs.value }}
          path: install.dir/*.dmg
          if-no-files-found: error

  mac-universal:
    name: macOS Universal DMG (ARM64 + x86_64)
    needs: mac
    runs-on: macos-14
    steps:
      - name: Resolve ref
        id: ref
        run: |
          if [ -n "${{ github.event.inputs.ref }}" ]; then
            echo "value=${{ github.event.inputs.ref }}" >> $GITHUB_OUTPUT
          else
            echo "value=${{ github.event.client_payload.ref }}" >> $GITHUB_OUTPUT
          fi

      - name: Download ARM64 build
        uses: actions/download-artifact@v4
        with:
          name: PXView-macOS-ARM64-${{ steps.ref.outputs.value }}
          path: arm64-dl

      - name: Download x86_64 build
        uses: actions/download-artifact@v4
        with:
          name: PXView-macOS-x86_64-${{ steps.ref.outputs.value }}
          path: x86_64-dl

      - name: Mount DMGs and extract apps
        run: |
          mkdir -p arm64 x86_64 universal
          # 挂载 ARM64 DMG 并提取 PXView.app
          hdiutil attach arm64-dl/*.dmg -nobrowse -mountpoint /tmp/arm64-mount
          cp -R /tmp/arm64-mount/PXView.app arm64/PXView.app
          hdiutil detach /tmp/arm64-mount
          # 挂载 x86_64 DMG 并提取 PXView.app
          hdiutil attach x86_64-dl/*.dmg -nobrowse -mountpoint /tmp/x86_64-mount
          cp -R /tmp/x86_64-mount/PXView.app x86_64/PXView.app
          hdiutil detach /tmp/x86_64-mount

      - name: Create universal binary with lipo
        run: |
          # 以 ARM64 app 为基础复制，然后逐个合并 x86_64 的 Mach-O 二进制
          cp -R arm64/PXView.app universal/PXView.app

          # 遍历 x86_64 app 中的所有文件，找出 Mach-O 二进制并用 lipo 合并
          find x86_64/PXView.app -type f | while read -r x86_file; do
              rel="${x86_file#x86_64/PXView.app/}"
              arm_file="arm64/PXView.app/$rel"
              uni_file="universal/PXView.app/$rel"

              # ARM64 版本不存在则跳过（保留 ARM64 基础中的文件）
              [ -f "$arm_file" ] || continue

              # 只对双方都是 Mach-O 的文件做 lipo 合并
              if file "$x86_file" | grep -q "Mach-O" && file "$arm_file" | grep -q "Mach-O"; then
                  echo "Combining: $rel"
                  lipo -create "$arm_file" "$x86_file" -output "$uni_file" \
                    || echo "WARN: Failed to combine $rel, keeping ARM64 version"
              fi
          done

          echo "=== Universal binary verification ==="
          file universal/PXView.app/Contents/MacOS/PXView
          lipo -info universal/PXView.app/Contents/MacOS/PXView

      - name: Re-sign and create universal DMG
        run: |
          # 清除可能的隔离标记
          xattr -cr universal/PXView.app
          # 重新递归签名（lipo 合并后签名失效，需要重新签）
          codesign --force --deep --sign - universal/PXView.app
          # 验证签名
          if ! codesign --verify --deep --strict universal/PXView.app 2>&1; then
            echo "ERROR: codesign verification failed for universal app"
            exit 1
          fi
          # 生成 Universal DMG
          hdiutil create -volname PXView -srcfolder universal/PXView.app \
            -ov -format UDZO universal/PXView.dmg
          ls -la universal/*.dmg

      - name: Verify Universal DMG (headless launch test)
        run: |
          set -e

          # ── 挂载 Universal DMG 并提取 .app ──
          hdiutil attach universal/PXView.dmg -nobrowse -mountpoint /tmp/vrf-uni-mount
          rm -rf /tmp/PXView-uni-vrf.app
          cp -R /tmp/vrf-uni-mount/PXView.app /tmp/PXView-uni-vrf.app
          hdiutil detach /tmp/vrf-uni-mount
          xattr -cr /tmp/PXView-uni-vrf.app

          APP_BIN="/tmp/PXView-uni-vrf.app/Contents/MacOS/PXView"

          echo "=== 1. 二进制架构验证 ==="
          file "$APP_BIN"
          lipo -info "$APP_BIN"
          ARCHS=$(lipo -archs "$APP_BIN" 2>/dev/null)
          echo "包含架构: $ARCHS"
          if echo "$ARCHS" | grep -q "x86_64" && echo "$ARCHS" | grep -q "arm64"; then
            echo "通过: Universal 二进制包含 arm64 + x86_64"
          else
            echo "失败: 不是 Universal 二进制"
            exit 1
          fi

          echo ""
          echo "=== 2. headless 启动测试 (ARM64 slice) ==="
          echo "在 ARM64 runner 上运行 Universal 二进制(自动选择 arm64 slice)..."
          echo ""
          "$APP_BIN" --headless -l 4 > /tmp/pxv-uni-headless.log 2>&1 &
          PID=$!
          sleep 15

          if kill -0 "$PID" 2>/dev/null; then
            echo "通过: 进程存活 15 秒 — 所有库加载成功"
            if lsof -iTCP:10110 -sTCP:LISTEN -P 2>/dev/null | grep -q LISTEN; then
              echo "通过: MCP 端口 10110 正在监听"
            else
              echo "警告: MCP 端口 10110 未监听"
            fi
            if lsof -iTCP:10430 -sTCP:LISTEN -P 2>/dev/null | grep -q LISTEN; then
              echo "通过: WebSocket 端口 10430 正在监听"
            else
              echo "警告: WS 端口 10430 未监听"
            fi
            echo ""
            echo "=== 应用输出(前 20 行) ==="
            head -20 /tmp/pxv-uni-headless.log 2>/dev/null || true
            kill "$PID" 2>/dev/null || true
            wait "$PID" 2>/dev/null || true
          else
            echo "失败: 进程在 15 秒内退出"
            EXIT_CODE=0
            wait "$PID" 2>/dev/null || EXIT_CODE=$?
            echo "退出码: $EXIT_CODE"
            echo ""
            echo "=== 应用输出日志 ==="
            cat /tmp/pxv-uni-headless.log 2>/dev/null || true
            echo ""
            echo "=== 崩溃报告 ==="
            ls -lt ~/Library/Logs/DiagnosticReports/PXView* 2>/dev/null | head -5 || echo "未找到崩溃日志"
            cat ~/Library/Logs/DiagnosticReports/PXView*.crash 2>/dev/null | head -80 || true
            exit 1
          fi

          echo ""
          echo "=== ✅ Universal DMG 验证通过 ==="

      - name: Upload Universal Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PXView-macOS-Universal-${{ steps.ref.outputs.value }}
          path: universal/*.dmg
          if-no-files-found: error

name: PXView Cross-Repo Build

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch/tag/SHA to build (e.g. view_and_data, main, abc123)'
        required: true
        default: 'view_and_data'
      targets:
        description: 'Which platforms to build (linux / mac / both)'
        required: true
        default: 'both'
        type: choice
        options: [linux, mac, both]
  repository_dispatch:
    types: [build]

jobs:
  linux:
    name: Linux AppImage (x86_64)
    if: ${{ github.event.inputs.targets == 'linux' || github.event.inputs.targets == 'both' || github.event.action == 'build' }}
    runs-on: ubuntu-22.04
    env:
      QT_PREFIX: ${{ github.workspace }}/Qt
      QT_VERSION: "6.11.0"
      LINUXDEPLOY_VERSION: "continuous"

    steps:
      - name: Resolve ref
        id: ref
        run: |
          if [ -n "${{ github.event.inputs.ref }}" ]; then
            echo "value=${{ github.event.inputs.ref }}" >> $GITHUB_OUTPUT
          else
            echo "value=${{ github.event.client_payload.ref }}" >> $GITHUB_OUTPUT
          fi

      - name: Checkout private PXView repo
        uses: actions/checkout@v4
        with:
          repository: haikumuse/PXView
          ref: ${{ steps.ref.outputs.value }}
          token: ${{ secrets.PXVIEW_PAT }}
          submodules: recursive
          persist-credentials: false

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git gcc g++ make cmake ninja-build pkg-config \
            libglib2.0-dev zlib1g-dev libusb-1.0-0-dev libudev-dev \
            libboost-dev libfftw3-dev libssl-dev \
            python3-dev python3-pip \
            libgl1-mesa-dev libxkbcommon-dev libxkbcommon-x11-0 libvulkan-dev \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-render0 libxcb-render-util0 libxcb-randr0 libxcb-shape0 \
            libxcb-shm0 libxcb-sync1 libxcb-xfixes0 libxcb-xinerama0 \
            libxcb-xinput0 libxcb-xkb1 libxcb-util1 \
            libwayland-dev libwayland-egl1 libwayland-client0 libwayland-cursor0 \
            libzip-dev nettle-dev libftdi1-dev \
            sdcc wget

      - name: Setup Node.js (for Web UI)
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install Qt via aqtinstall
        run: |
          pip3 install aqtinstall
          aqt install-qt linux desktop ${{ env.QT_VERSION }} linux_gcc_64 \
            -m qtwebsockets --outputdir ${{ env.QT_PREFIX }}
          echo "=== Platform plugins before qtwayland build ==="
          ls -la ${{ env.QT_PREFIX }}/${{ env.QT_VERSION }}/gcc_64/plugins/platforms/ || true

      - name: Build qtwayland platform plugin
        run: |
          # aqtinstall does not provide the qtwayland client platform plugin.
          # Build it from source against the aqtinstalled Qt so the AppImage
          # bundles both xcb and wayland platform plugins.
          # Only build the client side — the compositor (server) needs libdrm
          # and we don't need it (PXView is a client app, not a compositor).
          sudo apt-get install -y wayland-protocols libwayland-dev
          git clone --branch v${{ env.QT_VERSION }} --depth 1 https://github.com/qt/qtwayland.git
          cd qtwayland
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="${{ env.QT_PREFIX }}/${{ env.QT_VERSION }}/gcc_64" \
            -DCMAKE_INSTALL_PREFIX="${{ env.QT_PREFIX }}/${{ env.QT_VERSION }}/gcc_64" \
            -DQT_FEATURE_wayland_server=OFF \
            -DQT_FEATURE_wayland_client=ON
          cmake --build build --parallel $(nproc)
          cmake --install build
          echo "=== Platform plugins after qtwayland build ==="
          ls -la ${{ env.QT_PREFIX }}/${{ env.QT_VERSION }}/gcc_64/plugins/platforms/

      - name: Build fx2lafw firmware
        run: |
          bash build_fx2lafw.sh || echo "WARNING: fx2lafw firmware build failed"

      - name: Configure CMake
        run: |
          rm -rf build && mkdir -p build && cd build
          # linuxdeploy expects AppDir to contain usr/{bin,share,lib}.
          # Install to install.dir/usr so paths align with linuxdeploy's --appdir.
          cmake .. -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=../install.dir/usr \
            -DCMAKE_PREFIX_PATH="${{ env.QT_PREFIX }}/${{ env.QT_VERSION }}/gcc_64"

      - name: Build and Install Web UI (optional)
        run: |
          cd build && ninja install-webui || echo "WARNING: Web UI skipped"

      - name: Build PXView
        run: cd build && ninja -j $(nproc)

      - name: Install
        run: cd build && ninja install

      - name: Create AppImage using linuxdeploy
        run: |
          wget -c "https://github.com/linuxdeploy/linuxdeploy/releases/download/${{ env.LINUXDEPLOY_VERSION }}/linuxdeploy-x86_64.AppImage"
          wget -c "https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/${{ env.LINUXDEPLOY_VERSION }}/linuxdeploy-plugin-qt-x86_64.AppImage"
          chmod +x linuxdeploy*.AppImage
          export QMAKE="${{ env.QT_PREFIX }}/${{ env.QT_VERSION }}/gcc_64/bin/qmake"
          export LD_LIBRARY_PATH="${{ env.QT_PREFIX }}/${{ env.QT_VERSION }}/gcc_64/lib:$LD_LIBRARY_PATH"
          export OUTPUT="PXView-x86_64.AppImage"
          ./linuxdeploy-x86_64.AppImage \
            --appdir install.dir \
            -e install.dir/usr/bin/PXView \
            -d install.dir/usr/share/applications/pxview.desktop \
            --plugin qt \
            --output appimage

      - name: Verify AppImage
        run: |
          ls -la PXView-x86_64.AppImage
          chmod +x PXView-x86_64.AppImage

      - name: Package udev rules (separate artifact)
        run: |
          # udev rules must be installed to system path, not inside AppImage.
          # Package them separately with an install script.
          # Includes:
          #   - 60-px.rules: PXView-specific rules (PXLogic/Qinheng/Van Ooijen VID)
          #   - 60-libsigrok.rules: marks all libsigrok-supported USB devices with ID_SIGROK=1
          #   - 61-libsigrok-plugdev.rules: grants plugdev group access (Debian-based)
          #   - 61-libsigrok-uaccess.rules: grants local logged-in user access (systemd-logind)
          mkdir -p udev-rules
          cp install.dir/usr/lib/udev/rules.d/60-px.rules udev-rules/
          cp libsigrok/contrib/60-libsigrok.rules udev-rules/
          cp libsigrok/contrib/61-libsigrok-plugdev.rules udev-rules/
          cp libsigrok/contrib/61-libsigrok-uaccess.rules udev-rules/
          cat > udev-rules/install-udev-rules.sh << 'EOF'
          #!/bin/bash
          # Install udev rules for PXView hardware access (non-root USB permission)
          # Covers PXView devices (PXLogic, Qinheng, etc.) and all libsigrok-supported devices.
          # Usage: sudo ./install-udev-rules.sh
          set -e
          RULES_FILES="60-px.rules 60-libsigrok.rules 61-libsigrok-plugdev.rules 61-libsigrok-uaccess.rules"
          if [ "$(id -u)" -ne 0 ]; then
            echo "Please run with sudo: sudo $0"
            exit 1
          fi
          # Find system udev rules directory
          if [ -d /usr/lib/udev/rules.d ]; then
            DEST=/usr/lib/udev/rules.d
          elif [ -d /lib/udev/rules.d ]; then
            DEST=/lib/udev/rules.d
          elif [ -d /etc/udev/rules.d ]; then
            DEST=/etc/udev/rules.d
          else
            echo "Error: No udev rules directory found"
            exit 1
          fi
          echo "Installing udev rules to $DEST/"
          for f in $RULES_FILES; do
            if [ ! -f "$f" ]; then
              echo "Warning: $f not found, skipping"
              continue
            fi
            cp "$f" "$DEST/$f"
            echo "  -> installed $f"
          done
          udevadm control --reload-rules
          udevadm trigger
          echo ""
          echo "Done. PXView hardware devices should now be accessible without sudo."
          echo "Note: For the 'plugdev' group rule to take effect, add yourself to the group:"
          echo "  sudo usermod -aG plugdev \$USER"
          echo "Then log out and back in (or run 'newgrp plugdev')."
          EOF
          chmod +x udev-rules/install-udev-rules.sh
          # Create tarball
          tar -czf PXView-udev-rules.tar.gz -C udev-rules .
          ls -la PXView-udev-rules.tar.gz
          echo "=== udev rules contents ==="
          tar -tzf PXView-udev-rules.tar.gz

      - name: Upload AppImage Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PXView-Linux-x86_64-AppImage-${{ steps.ref.outputs.value }}
          path: PXView-x86_64.AppImage
          if-no-files-found: error

      - name: Upload udev rules Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PXView-Linux-udev-rules-${{ steps.ref.outputs.value }}
          path: PXView-udev-rules.tar.gz
          if-no-files-found: error

  mac:
    name: macOS DMG (ARM64)
    if: ${{ github.event.inputs.targets == 'mac' || github.event.inputs.targets == 'both' || github.event.action == 'build' }}
    runs-on: macos-latest
    steps:
      - name: Resolve ref
        id: ref
        run: |
          if [ -n "${{ github.event.inputs.ref }}" ]; then
            echo "value=${{ github.event.inputs.ref }}" >> $GITHUB_OUTPUT
          else
            echo "value=${{ github.event.client_payload.ref }}" >> $GITHUB_OUTPUT
          fi

      - name: Checkout private PXView repo
        uses: actions/checkout@v4
        with:
          repository: haikumuse/PXView
          ref: ${{ steps.ref.outputs.value }}
          token: ${{ secrets.PXVIEW_PAT }}
          submodules: recursive
          persist-credentials: false

      - name: Install dependencies via Homebrew
        run: |
          brew update
          brew install cmake ninja gettext glib libusb zlib boost fftw python3 qt pkg-config libzip nettle libftdi

      - name: Setup Node.js (for Web UI)
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Configure CMake
        run: |
          rm -rf build && mkdir -p build && cd build
          export LDFLAGS="-L$(brew --prefix gettext)/lib"
          export CPPFLAGS="-I$(brew --prefix gettext)/include"
          export PKG_CONFIG_PATH="$(brew --prefix gettext)/lib/pkgconfig:$PKG_CONFIG_PATH"
          cmake .. -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$(brew --prefix qt)" \
            -DCMAKE_INSTALL_PREFIX=../install.dir

      - name: Build and Package Web UI
        run: cd build && ninja && ninja install-webui

      - name: Install
        run: cd build && ninja install

      - name: Create DMG using macdeployqt
        run: |
          MACDEPLOYQT="$(brew --prefix qt)/bin/macdeployqt"
          PY_PREFIX="$(brew --prefix python@3.14)"
          mkdir -p "$PY_PREFIX/lib"
          if [ ! -e "$PY_PREFIX/lib/Python.framework" ] && [ -e "$PY_PREFIX/Frameworks/Python.framework" ]; then
            ln -s "$PY_PREFIX/Frameworks/Python.framework" "$PY_PREFIX/lib/Python.framework"
          fi
          # macdeployqt 只做依赖收集，不传 -codesign=-。
          # 旧版 -codesign=- 只签主二进制和 Qt 框架，但被复制进 Frameworks 的
          # 非 Qt 传递依赖（libbrotlicommon/libsharpyuv/libwebp）未签名
          # → codesign --verify 失败 → Gatekeeper 报"已损坏"。
          # 签名由后续步骤显式控制，dmg 由最后 hdiutil 生成（保证签后内容一致）。
          $MACDEPLOYQT install.dir/PXView.app \
            -always-overwrite -verbose=1 \
            || true   # macdeployqt 对找不到的 rpath 返回非零，但已复制大部分依赖

          # 预先从 Homebrew 复制 macdeployqt 报错说找不到的三个 dylib
          # （Qt WebEngine/Pdf 的传递依赖，PXView 没直接用，但 macdeployqt 会扫描到）
          # 问题：macdeployqt 复制版本化 dylib 时可能只复制符号链接，
          # 导致 install_name_tool 修改后签名失效。
          # 解决：从 Homebrew lib 直接复制实际文件 + 建立正确的符号链接。
          BREW_LIB="$(brew --prefix)/lib"
          mkdir -p install.dir/PXView.app/Contents/Frameworks
          for dep in libbrotlicommon.1.dylib libsharpyuv.0.dylib libwebp.7.dylib; do
            real_path="$(readlink -f "$BREW_LIB/$dep" 2>/dev/null || echo "$BREW_LIB/$dep")"
            if [ -f "$real_path" ]; then
              real_name="$(basename "$real_path")"
              cp -f "$real_path" install.dir/PXView.app/Contents/Frameworks/"$real_name"
              if [ "$real_name" != "$dep" ]; then
                rm -f install.dir/PXView.app/Contents/Frameworks/"$dep"
                ln -s "$real_name" install.dir/PXView.app/Contents/Frameworks/"$dep"
              fi
              install_name_tool -id "@rpath/$dep" install.dir/PXView.app/Contents/Frameworks/"$real_name"
            fi
          done

          # 清除 Homebrew/缓存下载的库可能带的隔离标记
          xattr -cr install.dir/PXView.app

          # 逐个签名所有 Mach-O 二进制（用 file 按 magic 识别，比 *.dylib 全）
          # 不再用 2>/dev/null || true 吞掉错误 —— 签名失败必须报错
          find install.dir/PXView.app -type f -print0 | while IFS= read -r -d '' f; do
            if file "$f" 2>/dev/null | grep -q "Mach-O"; then
              chmod u+w "$f" 2>/dev/null || true
              if ! codesign --force --sign - "$f" 2>&1; then
                echo "ERROR: Failed to sign $f"
                codesign -dvvv "$f" 2>&1 || true
                file "$f"
                otool -L "$f" 2>/dev/null | head -10
                exit 1
              fi
            fi
          done

          # 整体签名 .app（不用 --deep，已弃用；第 5 步已逐个签过子组件）
          codesign --force --sign - install.dir/PXView.app

          # 验证签名，失败则构建失败并打印诊断信息
          if ! codesign --verify --deep --strict install.dir/PXView.app 2>&1; then
            echo "ERROR: codesign verification failed"
            echo "=== Diagnostic: libbrotlicommon.1.dylib ==="
            ls -la install.dir/PXView.app/Contents/Frameworks/libbrotlicommon* 2>/dev/null || true
            codesign -dvvv install.dir/PXView.app/Contents/Frameworks/libbrotlicommon.1.dylib 2>&1 || true
            echo "=== All Frameworks ==="
            ls -la install.dir/PXView.app/Contents/Frameworks/
            exit 1
          fi

          # 签名完成后生成 dmg
          hdiutil create -volname PXView -srcfolder install.dir/PXView.app \
            -ov -format UDZO install.dir/PXView.dmg
          ls -la install.dir/*.dmg

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PXView-macOS-ARM64-${{ steps.ref.outputs.value }}
          path: install.dir/*.dmg
          if-no-files-found: error
